
name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-id:
    runs-on: ubuntu-latest
    steps:
      - name: Get chat updates
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS \
            "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates"
